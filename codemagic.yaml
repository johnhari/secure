workflows:
  ios-release:
    name: Build iOS IPA (Release)
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter & CocoaPods Setup
        script: |
          cd orderflow
          flutter config --no-analytics
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Build iOS IPA
        script: |
          cd orderflow
          flutter build ipa --release --no-codesign
    artifacts:
      - orderflow/build/ios/ipa/*.ipa
      - orderflow/build/ios/archive/*.xcarchive

  macos-release:
    name: Build macOS DMG (Release)
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter & CocoaPods Setup
        script: |
          cd orderflow
          flutter config --no-analytics
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Build macOS Application
        script: |
          cd orderflow
          flutter build macos --release
          mkdir -p build/macos/dmg
          hdiutil create -volname "ADVANCE ORDERFLOW ANALYZER" -srcfolder "build/macos/Build/Products/Release/orderflow.app" -ov -format UDZO "build/macos/dmg/Orderflow-Installer.dmg"
    artifacts:
      - orderflow/build/macos/dmg/*.dmg
