name: Build iOS IPA & Archive

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          cd orderflow
          flutter pub get

      - name: Install CocoaPods
        run: |
          cd orderflow/ios
          pod install

      - name: Build iOS (Unsigned Release / Archive)
        run: |
          cd orderflow
          flutter build ios --release --no-codesign
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../ipa/Orderflow-iOS-Release.ipa Payload
          cd ../../..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orderflow-iOS-Release-IPA
          path: orderflow/build/ios/ipa/Orderflow-iOS-Release.ipa
