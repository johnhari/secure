name: Build iOS IPA & Archive

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Configure Flutter & Dependencies
        run: |
          flutter config --no-analytics
          flutter config --no-enable-swift-package-manager
          mkdir -p orderflow/build/ios/SourcePackages
          mkdir -p orderflow/build/ios/ipa
          mkdir -p orderflow/build/ios/iphoneos
          cd orderflow
          flutter pub get

      - name: Sync CocoaPods Sandbox & Manifest
        run: |
          cd orderflow/ios
          pod install --repo-update || pod install

      - name: Build iOS Application (Release)
        run: |
          cd orderflow
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../ipa/Orderflow-iOS-Release.ipa Payload
          cd ../../..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orderflow-iOS-Release-IPA
          path: orderflow/build/ios/ipa/Orderflow-iOS-Release.ipa
