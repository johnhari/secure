name: Build iOS IPA & Archive

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Configure Flutter & Dependencies
        run: |
          flutter config --no-analytics
          flutter config --no-enable-swift-package-manager
          mkdir -p orderflow/build/ios/SourcePackages
          mkdir -p orderflow/build/ios/ipa
          cd orderflow
          rm -f ios/Podfile.lock
          rm -rf ios/Pods
          flutter pub get

      - name: Build iOS IPA & Archive
        run: |
          cd orderflow
          flutter build ipa --no-codesign || flutter build ios --release --no-codesign
          
          mkdir -p build/ios/ipa/Payload
          APP_PATH=$(find build ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -type d 2>/dev/null | head -n 1)
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            echo "Packaging IPA from: $APP_PATH"
            cp -r "$APP_PATH" build/ios/ipa/Payload/
            cd build/ios/ipa
            zip -r Orderflow-iOS-Release.ipa Payload
            cd ../../..
          fi

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orderflow-iOS-Release-IPA
          path: orderflow/build/ios/ipa/*.ipa
