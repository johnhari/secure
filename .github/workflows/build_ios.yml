name: Build iOS IPA & Archive

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Configure Flutter & Dependencies
        run: |
          flutter config --no-analytics
          flutter config --no-enable-swift-package-manager
          mkdir -p orderflow/build/ios/SourcePackages
          cd orderflow
          rm -f ios/Podfile.lock
          rm -rf ios/Pods
          rm -f pubspec.lock
          flutter pub get

      - name: Build iOS Application (Release)
        run: |
          cd orderflow
          flutter build ios --release --no-codesign
          
          # Find the compiled Runner.app
          APP_PATH=$(find build /Users/runner/Library/Developer/Xcode/DerivedData -name "Runner.app" -type d 2>/dev/null | grep -E "Release-iphoneos|iphoneos" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build /Users/runner/Library/Developer/Xcode/DerivedData -name "Runner.app" -type d 2>/dev/null | head -n 1)
          fi
          
          echo "Selected Runner.app: $APP_PATH"
          mkdir -p ipa_output/Payload
          cp -R "$APP_PATH" ipa_output/Payload/
          cd ipa_output
          zip -r ../Orderflow-iOS-Release.ipa Payload
          cd ..
          ls -lh Orderflow-iOS-Release.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orderflow-iOS-Release-IPA
          path: orderflow/Orderflow-iOS-Release.ipa
          if-no-files-found: error
