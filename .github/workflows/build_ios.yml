name: Build iOS IPA & Archive

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Configure Flutter & Dependencies
        run: |
          flutter config --no-analytics
          flutter config --no-enable-swift-package-manager
          mkdir -p orderflow/build/ios/SourcePackages
          cd orderflow
          rm -f ios/Podfile.lock
          rm -rf ios/Pods
          rm -f pubspec.lock
          flutter pub get

      - name: Build iOS Application (Release)
        run: |
          cd orderflow
          flutter build ios --release --no-codesign
          
          # Locate the complete compiled Runner.app
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            APP_DIR="build/ios/iphoneos/Runner.app"
          elif [ -d "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" ]; then
            APP_DIR="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          else
            APP_DIR=$(find . -name "Runner.app" -type d | head -n 1)
          fi
          
          echo "=== PACKAGING IPA FROM: $APP_DIR ==="
          rm -rf ipa_build
          mkdir -p ipa_build/Payload
          cp -R "$APP_DIR" ipa_build/Payload/
          cd ipa_build
          zip -r ../Orderflow-iOS-Release.ipa Payload
          cd ..
          
          echo "=== FINAL IPA DETAILS ==="
          ls -lh Orderflow-iOS-Release.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orderflow-iOS-Release-IPA
          path: orderflow/Orderflow-iOS-Release.ipa
          if-no-files-found: error
