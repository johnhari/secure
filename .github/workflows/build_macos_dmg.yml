name: Build macOS DMG Installer

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Configure Flutter & Dependencies
        run: |
          flutter config --no-analytics
          flutter config --no-enable-swift-package-manager
          mkdir -p orderflow/build/macos/SourcePackages
          mkdir -p orderflow/build/macos/dmg
          cd orderflow
          rm -f macos/Podfile.lock
          rm -rf macos/Pods
          flutter pub get

      - name: Build macOS Application (Release)
        run: |
          cd orderflow
          flutter build macos --release || xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Release -derivedDataPath build/macos/DerivedData -destination "generic/platform=macOS" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Create DMG Disk Image Installer
        run: |
          cd orderflow
          APP_PATH=$(find . ~/Library/Developer/Xcode/DerivedData -name "*.app" 2>/dev/null | head -n 1)
          echo "Found compiled macOS app at: $APP_PATH"
          mkdir -p build/macos/dmg
          hdiutil create -volname "ADVANCE ORDERFLOW ANALYZER" -srcfolder "$APP_PATH" -ov -format UDZO "build/macos/dmg/Orderflow-Installer.dmg"

      - name: Upload DMG Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orderflow-macOS-Installer-DMG
          path: orderflow/build/macos/dmg/Orderflow-Installer.dmg
