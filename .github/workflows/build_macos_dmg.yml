name: Build macOS DMG Installer

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Configure Flutter & Dependencies
        run: |
          flutter config --no-analytics
          flutter config --no-enable-swift-package-manager
          flutter doctor -v
          mkdir -p orderflow/build/macos/SourcePackages
          cd orderflow
          rm -f macos/Podfile.lock
          rm -rf macos/Pods
          rm -f pubspec.lock
          flutter pub get

      - name: Build macOS Application
        run: |
          cd orderflow
          flutter build macos --release 2>&1 | tee build_macos_log.txt || true
          
          echo "=== FLUTTER BUILD EXIT CODE: $? ==="
          
          APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Checking DerivedData for macOS .app..."
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found. Build failed."
            echo "=== Last 200 lines of build log ==="
            tail -200 build_macos_log.txt
            exit 1
          fi
          
          echo "Found macOS app at: $APP_PATH"
          mkdir -p build/macos/dmg_output
          hdiutil create -volname "ADVANCE ORDERFLOW ANALYZER" -srcfolder "$APP_PATH" -ov -format UDZO "build/macos/dmg_output/Orderflow-Installer.dmg"
          echo "DMG created successfully!"
          ls -la build/macos/dmg_output/Orderflow-Installer.dmg

      - name: Upload Build Log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Build-Log
          path: orderflow/build_macos_log.txt

      - name: Upload DMG Installer Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Orderflow-macOS-Installer-DMG
          path: orderflow/build/macos/dmg_output/Orderflow-Installer.dmg
          if-no-files-found: error
