name: Build macOS DMG Installer

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Configure Flutter & Dependencies
        run: |
          flutter config --no-analytics
          flutter config --no-enable-swift-package-manager
          mkdir -p orderflow/build/macos/SourcePackages
          cd orderflow
          rm -f macos/Podfile.lock
          rm -rf macos/Pods
          rm -f pubspec.lock
          flutter pub get

      - name: Build macOS Application
        run: |
          cd orderflow
          flutter build macos --release
          
          # Locate the complete compiled macOS app
          if [ -d "build/macos/Build/Products/Release/orderflow.app" ]; then
            APP_DIR="build/macos/Build/Products/Release/orderflow.app"
          else
            APP_DIR=$(find build/macos -name "*.app" -type d | head -n 1)
          fi
          
          echo "=== PACKAGING DMG FROM: $APP_DIR ==="
          rm -rf dmg_build Orderflow-Installer.dmg
          mkdir -p dmg_build
          cp -R "$APP_DIR" dmg_build/
          
          hdiutil create -volname "ADVANCE ORDERFLOW ANALYZER" -srcfolder dmg_build -ov -format UDZO Orderflow-Installer.dmg
          
          echo "=== FINAL DMG DETAILS ==="
          ls -lh Orderflow-Installer.dmg

      - name: Upload DMG Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orderflow-macOS-Installer-DMG
          path: orderflow/Orderflow-Installer.dmg
          if-no-files-found: error
