name: Build macOS DMG Installer

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-macos:
    runs-on: macos-13

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          cd orderflow
          flutter pub get

      - name: Build macOS App Release
        run: |
          cd orderflow
          flutter build macos --release

      - name: Create DMG Disk Image Installer
        run: |
          brew install create-dmg
          cd orderflow
          mkdir -p build/macos/dmg
          create-dmg \
            --volname "ADVANCE ORDERFLOW ANALYZER" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "Orderflow.app" 200 190 \
            --hide-extension "Orderflow.app" \
            --app-drop-link 600 190 \
            "build/macos/dmg/Orderflow-Installer.dmg" \
            "build/macos/Build/Products/Release/Orderflow.app" || true

          if [ ! -f "build/macos/dmg/Orderflow-Installer.dmg" ]; then
            hdiutil create -volname "Orderflow" -srcfolder "build/macos/Build/Products/Release/Orderflow.app" -ov -format UDZO "build/macos/dmg/Orderflow-Installer.dmg"
          fi

      - name: Upload DMG Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orderflow-macOS-Installer-DMG
          path: orderflow/build/macos/dmg/Orderflow-Installer.dmg
