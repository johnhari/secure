name: Build macOS DMG Installer

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Build Directories
        run: |
          mkdir -p orderflow/build/macos/SourcePackages
          mkdir -p orderflow/build/macos/dmg

      - name: Precache macOS Artifacts
        run: |
          cd orderflow
          flutter precache --macos

      - name: Install Dependencies
        run: |
          cd orderflow
          flutter pub get

      - name: Build macOS App Release
        run: |
          cd orderflow
          flutter build macos --release

      - name: Create DMG Disk Image Installer
        run: |
          cd orderflow
          mkdir -p build/macos/dmg
          hdiutil create -volname "ADVANCE ORDERFLOW ANALYZER" -srcfolder "build/macos/Build/Products/Release/orderflow.app" -ov -format UDZO "build/macos/dmg/Orderflow-Installer.dmg"

      - name: Upload DMG Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orderflow-macOS-Installer-DMG
          path: orderflow/build/macos/dmg/Orderflow-Installer.dmg
