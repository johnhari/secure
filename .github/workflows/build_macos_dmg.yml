name: Build macOS DMG Installer

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Configure Flutter & Dependencies
        run: |
          flutter config --no-analytics
          flutter config --no-enable-swift-package-manager
          mkdir -p orderflow/build/macos/SourcePackages
          cd orderflow
          rm -f macos/Podfile.lock
          rm -rf macos/Pods
          flutter pub get

      - name: Build macOS Application
        run: |
          cd orderflow
          flutter build macos --release

      - name: Create DMG Disk Image Installer
        run: |
          cd orderflow
          APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -n 1)
          fi
          echo "Packaging macOS app from: $APP_PATH"
          mkdir -p build/macos/dmg_output
          hdiutil create -volname "ADVANCE ORDERFLOW ANALYZER" -srcfolder "$APP_PATH" -ov -format UDZO "build/macos/dmg_output/Orderflow-Installer.dmg"

      - name: Upload DMG Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orderflow-macOS-Installer-DMG
          path: orderflow/build/macos/dmg_output/Orderflow-Installer.dmg
          if-no-files-found: error
