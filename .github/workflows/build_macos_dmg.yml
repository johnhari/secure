name: Build macOS DMG Installer

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Configure Flutter & Dependencies
        run: |
          flutter config --no-analytics
          flutter config --no-enable-swift-package-manager
          mkdir -p orderflow/build/macos/SourcePackages
          cd orderflow
          rm -f macos/Podfile.lock
          rm -rf macos/Pods
          rm -f pubspec.lock
          flutter pub get

      - name: Build macOS Application
        run: |
          cd orderflow
          flutter build macos --release
          
          echo "=== SEARCHING FOR COMPILED MACOS APP ==="
          APP_PATH=$(find build "$HOME/Library/Developer/Xcode/DerivedData" -name "orderflow.app" -type d 2>/dev/null | grep -E "Release" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build "$HOME/Library/Developer/Xcode/DerivedData" -name "*.app" -type d 2>/dev/null | head -n 1)
          fi
          
          echo "Found macOS App at: $APP_PATH"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: macOS .app bundle was not produced."
            exit 1
          fi
          
          echo "=== PACKAGING DMG ==="
          rm -rf dmg_output Orderflow-Installer.dmg
          mkdir -p dmg_output
          cp -R "$APP_PATH" dmg_output/
          
          hdiutil create -volname "ADVANCE ORDERFLOW ANALYZER" -srcfolder dmg_output -ov -format UDZO Orderflow-Installer.dmg
          
          echo "=== FINAL DMG FILE ==="
          ls -lh Orderflow-Installer.dmg

      - name: Upload DMG Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orderflow-macOS-Installer-DMG
          path: orderflow/Orderflow-Installer.dmg
          if-no-files-found: error
