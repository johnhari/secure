name: Build macOS DMG Installer

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Configure Flutter & Dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter config --no-analytics
          cd orderflow
          mkdir -p build/macos/SourcePackages
          mkdir -p build/macos/dmg
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        run: |
          cd orderflow/macos
          pod install --repo-update || pod install

      - name: Build macOS App Release
        run: |
          cd orderflow
          flutter build macos --release

      - name: Create DMG Disk Image Installer
        run: |
          cd orderflow
          mkdir -p build/macos/dmg
          hdiutil create -volname "ADVANCE ORDERFLOW ANALYZER" -srcfolder "build/macos/Build/Products/Release/orderflow.app" -ov -format UDZO "build/macos/dmg/Orderflow-Installer.dmg"

      - name: Upload DMG Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orderflow-macOS-Installer-DMG
          path: orderflow/build/macos/dmg/Orderflow-Installer.dmg
