name: Release All Platforms (iOS, macOS, Android, Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apple:
    runs-on: macos-14
    strategy:
      matrix:
        target: [ios, macos]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Configure Flutter
        run: |
          flutter config --no-analytics
          flutter config --no-enable-swift-package-manager
          mkdir -p orderflow/build/${{ matrix.target }}/SourcePackages
          cd orderflow
          rm -f ${{ matrix.target }}/Podfile.lock
          rm -rf ${{ matrix.target }}/Pods
          rm -f pubspec.lock
          flutter pub get

      - name: Build iOS IPA
        if: matrix.target == 'ios'
        run: |
          cd orderflow
          flutter build ios --release --no-codesign
          APP_PATH=$(find build /Users/runner/Library/Developer/Xcode/DerivedData -name "Runner.app" -type d 2>/dev/null | grep -E "Release-iphoneos|iphoneos" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build /Users/runner/Library/Developer/Xcode/DerivedData -name "Runner.app" -type d 2>/dev/null | head -n 1)
          fi
          mkdir -p ipa_output/Payload
          cp -R "$APP_PATH" ipa_output/Payload/
          cd ipa_output
          zip -r ../Orderflow-iOS-Release.ipa Payload
          cd ..

      - name: Build macOS DMG
        if: matrix.target == 'macos'
        run: |
          cd orderflow
          flutter build macos --release
          APP_PATH=$(find build /Users/runner/Library/Developer/Xcode/DerivedData -name "orderflow.app" -type d 2>/dev/null | grep -E "Release" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build /Users/runner/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -n 1)
          fi
          mkdir -p dmg_output
          cp -R "$APP_PATH" dmg_output/
          hdiutil create -volname "ADVANCE ORDERFLOW ANALYZER" -srcfolder dmg_output -ov -format UDZO Orderflow-macOS-Installer.dmg

      - name: Upload iOS IPA Artifact
        if: matrix.target == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: Orderflow-iOS-Release-IPA
          path: orderflow/Orderflow-iOS-Release.ipa

      - name: Upload macOS DMG Artifact
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: Orderflow-macOS-Installer-DMG
          path: orderflow/Orderflow-macOS-Installer.dmg
